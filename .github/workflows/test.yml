name: tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci || npm install
      - run: npm run vendor
      - name: Verify vendor/ matches pinned dependency versions
        run: git diff --exit-code vendor/
      - run: npm test
